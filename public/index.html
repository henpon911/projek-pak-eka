<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">

        <header class="topbar">
            <div class="title-group">
                <span class="eyebrow">Sistem Akademik</span>
                <h1>Student Management System</h1>
                <p>Manajemen Data Siswa</p>
            </div>

            <div class="header-actions">
                <span class="status-pill">Live data</span>
                <button id="darkMode" type="button">
                    🌙 Dark Mode
                </button>
            </div>
        </header>

        <div class="summary-grid">
            <div class="stat-card accent-blue">
                <div class="card-icon">👥</div>
                <div>
                    <p>Total Siswa</p>
                    <h3 id="jumlahSiswa">0</h3>
                </div>
            </div>

            <div class="stat-card accent-purple">
                <div class="card-icon">🏫</div>
                <div>
                    <p>Kelas Tersedia</p>
                    <h3 id="kelasCount">0</h3>
                </div>
            </div>

            <div class="stat-card accent-green">
                <div class="card-icon">✅</div>
                <div>
                    <p>Status</p>
                    <h3>Aktif</h3>
                </div>
            </div>
        </div>

        <div id="message"></div>

        <section class="panel form-panel">
            <div class="panel-header">
                <div>
                    <span class="eyebrow">Formulir</span>
                    <h2 id="formTitle">Tambah Siswa</h2>
                </div>
            </div>

            <form id="formSiswa">

                <input type="hidden" id="id">

                <div class="form-grid">

                    <div class="field-group">
                        <label for="nis">NIS</label>
                        <input
                            type="text"
                            id="nis"
                            placeholder="Masukkan NIS"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label for="nama">Nama</label>
                        <input
                            type="text"
                            id="nama"
                            placeholder="Masukkan nama"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label for="kelas">Kelas</label>
                        <input
                            type="text"
                            id="kelas"
                            placeholder="Contoh: XI RPL 1"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label for="jurusan">Jurusan</label>
                        <input
                            type="text"
                            id="jurusan"
                            placeholder="Masukkan jurusan"
                            required
                        >
                    </div>

                </div>

                <div class="field-group full-width">
                    <label for="alamat">Alamat</label>
                    <textarea
                        id="alamat"
                        placeholder="Masukkan alamat"
                        required
                    ></textarea>
                </div>

                <div class="form-button">
                    <button type="submit" id="btnSimpan">
                        💾 Simpan
                    </button>

                    <button
                        type="button"
                        class="btn-cancel"
                        onclick="resetForm()"
                    >
                        Batal
                    </button>
                </div>

            </form>
        </section>

        <section class="panel table-panel">
            <div class="panel-header table-header">
                <div>
                    <span class="eyebrow">Database</span>
                    <h2>Daftar Siswa</h2>
                </div>

                <button class="btn-secondary" type="button" onclick="loadSiswa()">
                    🔄 Refresh
                </button>
            </div>

            <div class="filter">
                <input
                    type="text"
                    id="search"
                    placeholder="🔎 Cari nama atau NIS..."
                    onkeyup="filterData()"
                >

                <select
                    id="filterKelas"
                    onchange="filterData()"
                >
                    <option value="">Semua Kelas</option>
                </select>
            </div>

            <div id="loading">
                ⏳ Mengambil data...
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NIS</th>
                            <th>Nama</th>
                            <th>Kelas</th>
                            <th>Jurusan</th>
                            <th>Alamat</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataSiswa"></tbody>
                </table>
            </div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
